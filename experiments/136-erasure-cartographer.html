<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Erasure Cartographer</title>
<style>html,body{margin:0;background:#090c10;color:#c9d3d1;font:13px ui-monospace,monospace;overflow:hidden}canvas{display:block}.note{position:fixed;left:24px;top:20px;pointer-events:none;letter-spacing:.08em}.note strong{display:block;color:#e2b978;font-weight:400;margin-bottom:7px}.note span{color:#84918f}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script></head><body><div class="note"><strong>ERASURE CARTOGRAPHER / 136</strong><span id="readout">three registers vote; only the disagreement leaves a trace</span></div>
<script>
let tick=0, traces=[];
const moduli=[17,29,43];
function setup(){createCanvas(windowWidth,windowHeight);pixelDensity(1);}
function draw(){background(9,12,16);translate(width/2,height/2);const r=min(width,height)*.36;
  // Three residue clocks advance at incommensurate rates. Agreement is invisible; a failed quorum deposits a fading coordinate.
  const phases=moduli.map((m,i)=>(tick*(i+2)+[0,7,13][i])%m);
  const votes=phases.map((v,i)=>v/(moduli[i]-1));
  const spread=max(votes)-min(votes), quorum=spread<.075;
  noFill();stroke(43,59,62,100);for(let i=0;i<3;i++)ellipse(0,0,r*(.72+i*.23),r*(.72+i*.23));
  for(let i=0;i<3;i++){const a=TWO_PI*votes[i]-HALF_PI,rr=r*(.72+i*.23);stroke([94,170,153][i],[145,158,176][i],[165,130,105][i],150);line(0,0,cos(a)*rr,sin(a)*rr);noStroke();fill(210,187,140,210);circle(cos(a)*rr,sin(a)*rr,5);}
  if(frameCount%8===0&&!quorum){traces.push({x:cos(TWO_PI*votes[1])*r*(.45+spread),y:sin(TWO_PI*votes[2])*r*(.45+spread),life:1,spread});}
  for(const p of traces){p.life*=.994;noFill();stroke(198,139,99,110*p.life);circle(p.x,p.y,4+p.spread*r*.7);}
  traces=traces.filter(p=>p.life>.08).slice(-420);
  if(frameCount%18===0)document.getElementById('readout').textContent=quorum?`quorum / residue withheld / ${traces.length} unresolved marks`:`registers ${phases.join(' · ')} / spread ${nf(spread,1,3)} / ${traces.length} unresolved marks`;
  tick+=.17;
}
function windowResized(){resizeCanvas(windowWidth,windowHeight)}
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase Tithe</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090c12;color:#d8d8d0;font:12px/1.5 ui-monospace,SFMono-Regular,monospace}canvas{display:block}.note{position:fixed;left:22px;top:18px;pointer-events:none;letter-spacing:.08em;text-transform:uppercase;color:#b8c1bd}.note small{display:block;margin-top:7px;color:#737f7a;text-transform:none;letter-spacing:0}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head><body><div class="note">phase tithe <small id="readout">Three clocks collect a fee when they nearly agree.</small></div>
<script>
const clocks=[17,23,31], rings=72; let t=0, sparks=[];
function setup(){createCanvas(windowWidth,windowHeight);pixelDensity(1); noFill();}
function draw(){background(9,12,18,42);translate(width/2,height/2);const scale=min(width,height)*.37; t+=.006;
  for(let i=0;i<rings;i++){
    const u=i/rings, phases=clocks.map((p,j)=>((frameCount*.013*(j+1)+i*p)% (p*TAU))/(p*TAU));
    const angles=phases.map((v,j)=>v*TAU + j*TWO_PI/3 + t*(j%2?-.3:.3));
    let coherence=1-Math.max(...phases.map((v,j)=>Math.abs(v-phases[(j+1)%3])));
    let r=scale*(.12+.88*u), fee=Math.pow(max(0,coherence),5);
    stroke(90+fee*155,145+fee*70,160+fee*60,20+fee*170);strokeWeight(.5+fee*2.2);
    beginShape();for(let j=0;j<3;j++){let rr=r*(1+fee*.22),a=angles[j];vertex(cos(a)*rr,sin(a)*rr);}endShape(CLOSE);
    if(fee>.92 && frameCount%2===0){let a=angles[0];sparks.push({x:cos(a)*r,y:sin(a)*r,life:1});}
  }
  for(let i=sparks.length-1;i>=0;i--){let s=sparks[i];s.life-=.018;stroke(235,219,163,s.life*180);strokeWeight(1);point(s.x,s.y);if(s.life<=0)sparks.splice(i,1)}
  if(sparks.length>700)sparks.splice(0,sparks.length-700);
  resetMatrix();
}
function windowResized(){resizeCanvas(windowWidth,windowHeight);}
</script></body></html>

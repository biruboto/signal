<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parity Levy</title><style>html,body{margin:0;background:#090b10;color:#c9d3d8;font:12px/1.6 ui-monospace,monospace;overflow:hidden}canvas{display:block}.note{position:fixed;left:24px;bottom:20px;letter-spacing:.12em;text-transform:uppercase;pointer-events:none}.note small{display:block;color:#75858c;margin-top:5px}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script></head><body><div class="note" id="readout">Parity Levy<small>every disagreement changes the direction of the walk · click to reseed</small></div><script>
let walkers=[],step=0,palette=['#96c8bc','#e9bd74','#d78274','#8796ce'];
function setup(){createCanvas(windowWidth,windowHeight);pixelDensity(1);background(9,11,16);resetWalk()}
function resetWalk(){background(9,11,16);walkers=[];for(let i=0;i<4;i++)walkers.push({x:width*(.2+i*.2),y:height*.5,dx:0,dy:0,parity:i%2,color:palette[i]});step=0}
function draw(){for(let n=0;n<8;n++){step++;for(let i=0;i<walkers.length;i++){let w=walkers[i],a=floor(noise(i*31+step*.013)*8),turn=(a+(w.parity?3:0))%8;let ang=turn*TWO_PI/8;let nx=w.x+cos(ang)*2.2,ny=w.y+sin(ang)*2.2;let ix=constrain(floor(nx/5),0,floor(width/5)-1),iy=constrain(floor(ny/5),0,floor(height/5)-1);let occupied=((ix*17+iy*31+floor(step/11))%7)<2;w.parity^=occupied?1:0;stroke(w.color);strokeWeight(.8);line(w.x,w.y,nx,ny);w.x=nx;w.y=ny;if(w.x<0||w.x>width||w.y<0||w.y>height){w.x=random(width);w.y=random(height);w.parity^=1}}}if(frameCount%120===0)document.getElementById('readout').innerHTML='Parity Levy · '+step.toLocaleString()+' steps<small>every disagreement changes the direction of the walk · click to reseed</small>'}
function mousePressed(){resetWalk()}function windowResized(){resizeCanvas(windowWidth,windowHeight);resetWalk()}
</script></body></html>

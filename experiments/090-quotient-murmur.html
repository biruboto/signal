<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>quotient murmur</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; overflow: hidden; background: #080a0d; color: #d9d8d0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #note { position: fixed; left: 22px; bottom: 19px; z-index: 2; font-size: 11px; letter-spacing: .07em; line-height: 1.55; color: #aaa9a1; pointer-events: none; }
  #title { color: #e5e2d6; }
  #readout { color: #9eb9b0; }
</style>
</head>
<body>
<div id="note"><span id="title">quotient murmur</span><br><span id="readout"></span></div>
<script>
let seed = 1, cadence = 0;
const residues = [];

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  noStroke();
}

// Every column begins as a pair of integers. Euclid's descent leaves a quotient
// at each step; those quotients are the only marks allowed to survive.
function pairAt(column, epoch) {
  const a = 89 + ((column * 37 + epoch * 53 + seed * 71) % 233);
  const b = 21 + ((column * 61 + epoch * 29 + seed * 17) % 157);
  return [Math.max(a, b), Math.min(a, b)];
}

function draw() {
  background(8, 10, 13);
  const margin = Math.max(34, Math.min(width, height) * .075);
  const columns = Math.max(18, Math.min(68, Math.floor((width - margin * 2) / 15)));
  const rows = Math.max(7, Math.min(14, Math.floor((height - margin * 2) / 34)));
  const epoch = Math.floor(frameCount / 46) + cadence;
  const dx = (width - margin * 2) / columns;
  const dy = Math.min(38, (height - margin * 2) / (rows + 1));
  let utterances = 0, terminal = 0, largest = 0;

  for (let c = 0; c < columns; c++) {
    let [a, b] = pairAt(c, epoch);
    for (let r = 0; r < rows && b > 0; r++) {
      const q = Math.floor(a / b);
      const rem = a % b;
      const x = margin + (c + .5) * dx;
      const y = height * .52 - (rows * dy) / 2 + r * dy;
      const pulse = .55 + .45 * Math.sin(frameCount * .055 + c * .41 + r);
      const w = Math.min(dx * .9, 1.4 + Math.log2(q + 1) * dx * .24);
      const hue = Math.min(220, 72 + q * 24 + r * 5);
      fill(58 + hue * .33, 106 + hue * .42, 103 + hue * .28, 48 + pulse * 122);
      rect(x - w / 2, y, w, 2 + Math.min(4, q) * .42, 1);
      if (q > 3) {
        fill(204, 187, 141, 45 + pulse * 80);
        ellipse(x + w * .55, y + 1, 1.8 + Math.min(5, q), 1.8 + Math.min(5, q));
      }
      utterances++;
      largest = Math.max(largest, q);
      if (rem === 0) { terminal++; break; }
      a = b; b = rem;
    }
  }

  stroke(123, 163, 154, 35); strokeWeight(1);
  line(margin, height * .52 + (rows * dy) / 2 + 13, width - margin, height * .52 + (rows * dy) / 2 + 13);
  noStroke();
  document.getElementById('readout').textContent = `${utterances} quotients released · ${terminal} descents reached their common divisor · loudest quotient ${largest} · click to reseed`;
}

function mousePressed() { seed = (seed + 1) % 997; cadence += 3; }
function windowResized() { resizeCanvas(windowWidth, windowHeight); }
</script>
</body>
</html>

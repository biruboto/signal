<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>crt tidepool</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; background: #070a0b; color: #d6d3c7; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    canvas { display: block; }
    #label { position: fixed; left: 22px; bottom: 19px; max-width: min(590px, calc(100vw - 44px)); font-size: 11px; line-height: 1.55; letter-spacing: .035em; color: rgba(214,211,199,.67); pointer-events: none; }
    #label strong { display: block; color: #e5b76d; font-size: 12px; font-weight: 500; letter-spacing: .11em; text-transform: lowercase; }
    #readout { color: rgba(214,211,199,.43); }
  </style>
</head>
<body>
  <div id="label"><strong>crt tidepool</strong><span id="readout">small clocks are waiting for the same instant</span></div>
<script>
let cells = [], readout;
const pairs = [[5,7],[7,9],[8,11],[9,13],[11,14],[13,15]];

function setup() {
  createCanvas(windowWidth, windowHeight);
  pixelDensity(1);
  readout = document.getElementById('readout');
  seedPool();
  background(7, 10, 11);
}

function inverse(a, m) {
  let b = m, x = 1, y = 0;
  while (b) { const q = Math.floor(a / b); [a, b] = [b, a % b]; [x, y] = [y, x - q * y]; }
  return (x % m + m) % m;
}

function rendezvous(a, b, r, s) {
  // the first instant satisfying n = r (mod a), n = s (mod b)
  const k = (((s - r) * inverse(a, b)) % b + b) % b;
  return r + a * k;
}

function seedPool() {
  cells = [];
  const gap = Math.max(18, Math.min(35, width / 38));
  let row = 0;
  for (let y = gap * .8; y < height - 48; y += gap, row++) {
    let col = 0;
    for (let x = gap * .75; x < width; x += gap, col++) {
      const pair = pairs[(col * 3 + row * 5) % pairs.length];
      const r = (col * 2 + row) % pair[0];
      const s = (col + row * 3) % pair[1];
      cells.push({x, y, a: pair[0], b: pair[1], r, s, meet: rendezvous(pair[0], pair[1], r, s), glow: 0});
    }
  }
}

function draw() {
  noStroke();
  fill(7, 10, 11, 24);
  rect(0, 0, width, height);
  const t = Math.floor(frameCount / 3);
  let arrivals = 0;
  for (const c of cells) {
    const cycle = c.a * c.b;
    const distance = Math.min((t - c.meet + cycle) % cycle, (c.meet - t + cycle) % cycle);
    const arrival = distance === 0;
    if (arrival) arrivals++;
    c.glow = lerp(c.glow, arrival ? 1 : Math.max(0.012, 1 - distance / 9) * .22, arrival ? .38 : .075);
    const pulse = c.glow * (arrival ? 1.3 : .65);
    if (arrival) fill(232, 183, 104, 210 * pulse);
    else if (distance < 3) fill(113, 160, 165, 130 * pulse);
    else fill(81, 105, 104, 52 * pulse + 9);
    const radius = 1.2 + pulse * (arrival ? 7 : 3.2);
    circle(c.x + Math.sin(t * .05 + c.y) * pulse, c.y, radius * 2);
  }
  readout.textContent = `instant ${String(t).padStart(6, '0')}  /  ${arrivals} local rendezvous${arrivals === 1 ? '' : 'es'}  /  each mote keeps two incompatible clocks`;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  background(7, 10, 11);
  seedPool();
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gap bell</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<style>
  *{box-sizing:border-box} body{margin:0;overflow:hidden;background:#07090b;color:#d8d5ca;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  #caption{position:fixed;left:22px;bottom:19px;max-width:430px;line-height:1.55;letter-spacing:.02em;pointer-events:none}
  #readout{position:fixed;right:22px;top:19px;text-align:right;line-height:1.55;color:#9fa9a7;pointer-events:none}
  b{font-weight:500;color:#e8b567}
</style>
</head>
<body>
<div id="readout"></div>
<div id="caption"><b>gap bell</b><br>three counting systems agree only at irregular distances.<br>each agreement leaves a ring; the gaps decide its weight.<br><span style="color:#747a7d">click to change the hidden offsets</span></div>
<script>
let offsets, events=[], cursor=1, lastHit=0, seed;
const mods=[7,11,13];
function setup(){ createCanvas(windowWidth,windowHeight); pixelDensity(1); reseed(); }
function reseed(){
  seed=floor(random(100000,999999)); randomSeed(seed);
  offsets=mods.map(m=>floor(random(m))); events=[]; cursor=1; lastHit=0;
  background(7,9,11);
}
function acceptable(n){
  // The bell only admits a number when its three residues form a strict staircase.
  const r=mods.map((m,i)=>(n+offsets[i])%m/m);
  return r[0]<r[1] && r[1]<r[2] && r[2]-r[0]>.38;
}
function draw(){
  background(7,9,11,38);
  let found=0;
  while(found<2 && cursor<180000){
    if(acceptable(cursor)){
      const gap=cursor-lastHit; lastHit=cursor;
      events.push({n:cursor,gap,age:0,phase:random(TWO_PI)}); found++;
    }
    cursor++;
  }
  translate(width*.5,height*.49);
  noFill();
  for(const e of events){
    e.age+=1;
    const life=520, a=constrain(1-e.age/life,0,1);
    const radius=(18+sqrt(e.gap)*12)+e.age*.23;
    const wobble=sin(e.age*.022+e.phase)*e.gap*.12;
    stroke(214,181,103,120*a); strokeWeight(1);
    arc(0,0,radius*2,radius*2,e.phase+wobble*.01,e.phase+PI+log(e.gap+1)*.34+wobble*.01);
    stroke(85,142,150,70*a);
    arc(0,0,(radius+5)*2,(radius+5)*2,e.phase+PI,e.phase+TWO_PI-log(e.gap+1)*.22);
  }
  events=events.filter(e=>e.age<540);
  const newest=events[events.length-1];
  document.getElementById('readout').innerHTML=
    'offsets <b>'+offsets.join(' · ')+'</b><br>last gap <b>'+(newest?newest.gap:'—')+'</b><br>integer <b>'+(newest?newest.n:'—')+'</b>';
}
function mousePressed(){reseed()}
function windowResized(){resizeCanvas(windowWidth,windowHeight);background(7,9,11)}
</script>
</body>
</html>

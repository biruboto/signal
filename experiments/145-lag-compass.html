<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lag Compass — Signal</title>
<style>
html,body{margin:0;background:#0b0d10;color:#d8d5cc;font-family:ui-monospace,SFMono-Regular,monospace;overflow:hidden}canvas{display:block}#label{position:fixed;left:24px;top:22px;pointer-events:none;line-height:1.6;font-size:12px;letter-spacing:.04em;color:#a9a69d}#label strong{font-weight:400;color:#eee9dc;letter-spacing:.12em}#hint{position:fixed;right:24px;bottom:20px;font-size:10px;color:#777970;pointer-events:none}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script></head>
<body><div id="label"><strong>LAG COMPASS</strong><br><span id="readout">three clocks, one delayed agreement</span></div><div id="hint">click to change the delay · each ray remembers a different past</div>
<script>
let agents=[], trails=[], delay=17, tick=0, cx, cy;
function setup(){createCanvas(windowWidth,windowHeight);pixelDensity(1);cx=width/2;cy=height/2;for(let i=0;i<3;i++){agents.push({period:[89,113,137][i],phase:random(TWO_PI),hue:[188,38,270][i],memory:[]});}}
function draw(){background(11,13,16,35);cx=width/2;cy=height/2;tick++;
// Each clock emits a phase; its ray is aimed at another clock's delayed phase.
let vals=agents.map(a=>{let v=(tick/a.period+a.phase/TWO_PI)%1;a.memory.push(v);if(a.memory.length>delay+2)a.memory.shift();return v;});
let delayed=agents.map(a=>a.memory[Math.max(0,a.memory.length-1-delay)]||0);
let radius=min(width,height)*.28;
noFill();stroke(48,51,56);circle(cx,cy,radius*2);circle(cx,cy,radius*1.32);
for(let i=0;i<3;i++){let a=agents[i], angle=vals[i]*TWO_PI-HALF_PI;let target=(delayed[(i+1)%3]-vals[i])*TWO_PI;let x=cx+cos(angle)*radius,y=cy+sin(angle)*radius;let tx=cx+cos(angle+target)*radius*.72,ty=cy+sin(angle+target)*radius*.72;
let col=color(a.hue,190,225,180);colorMode(HSB,360,255,255,255);stroke(a.hue,95,185,100);line(cx,cy,x,y);stroke(a.hue,150,255,180);line(x,y,tx,ty);noStroke();fill(a.hue,100,240,220);circle(x,y,7);fill(a.hue,170,255,120);circle(tx,ty,3);colorMode(RGB,255);
}
// Agreement is not simultaneity: show the nearest pairwise phase gaps as a little corona.
let gaps=[];for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){let d=Math.abs(vals[i]-vals[j]);gaps.push(Math.min(d,1-d));}
let concord=1-(gaps.reduce((s,v)=>s+v,0)/gaps.length)*2;
noStroke();fill(208,204,190,140);textAlign(CENTER,CENTER);textSize(10);text('agreement '+Math.round(concord*100)+'%',cx,cy+radius+28);
if(tick%90===0)document.getElementById('readout').textContent=`delay ${delay} beats · agreement ${Math.round(concord*100)}%`;
}
function mousePressed(){delay=delay===41?3:delay+4;document.getElementById('readout').textContent=`delay ${delay} beats · three clocks, one delayed agreement`;}
function windowResized(){resizeCanvas(windowWidth,windowHeight);}
</script></body></html>

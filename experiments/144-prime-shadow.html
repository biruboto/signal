<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prime shadow</title>
<style>
html,body{margin:0;background:#080a0d;color:#c8c5bb;font:12px/1.5 ui-monospace,SFMono-Regular,monospace;overflow:hidden}canvas{display:block}.label{position:fixed;left:22px;top:18px;pointer-events:none;letter-spacing:.08em}.label span{color:#707b7a}.hint{position:fixed;right:22px;bottom:18px;color:#707b7a;pointer-events:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<div class="label">PRIME SHADOW<br><span id="readout">a sieve viewed from its absences</span></div>
<div class="hint">click to change the sieve · each dark gap is a surviving integer</div>
<script>
let moduli=[2,3,5,7,11,13],phase=0,step=0;
function setup(){createCanvas(windowWidth,windowHeight);pixelDensity(1);noStroke();}
function draw(){background(8,10,13);let cell=max(7,min(18,width/72)),cols=floor((width-44)/cell),rows=floor((height-90)/cell),ox=(width-cols*cell)/2,oy=(height-40-rows*cell)/2+18;let m=moduli[phase];
for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let n=y*cols+x+1;let alive=true,culprit=0;for(let i=0;i<m;i++){let p=[2,3,5,7,11,13][i];if(n%p===0&&n!==p){alive=false;culprit=i;break;}}let wobble=(sin(frameCount*.018+n*.037)+1)*.5;let xx=ox+x*cell,yy=oy+y*cell;if(alive){fill(185+25*wobble,190+22*wobble,174+25*wobble,190);rect(xx+1,yy+1,cell-2,cell-2,2);}else{let a=20+culprit*7+18*wobble;fill(22+culprit*3,38+culprit*5,44+culprit*5,a+28);rect(xx+1,yy+1,cell-2,cell-2,2);if((n+step)%31===0){fill(100+culprit*12,142,136,90);rect(xx+cell*.42,yy+cell*.42,2,2);}}}
fill(101,116,112);textSize(10);textAlign(LEFT);text('divisors '+[2,3,5,7,11,13].slice(0,phase+1).join(' · ')+'     survivors: '+countSurvivors(cols*rows,phase+1),22,height-19);
}
function countSurvivors(limit,count){let c=0;for(let n=1;n<=limit;n++){let ok=true;for(let i=0;i<count;i++){let p=[2,3,5,7,11,13][i];if(n%p===0&&n!==p){ok=false;break;}}if(ok)c++;}return c;}
function mousePressed(){phase=(phase+1)%moduli.length;step++;document.getElementById('readout').textContent='sieve depth '+(phase+1)+' · absence becomes structure';}
function windowResized(){resizeCanvas(windowWidth,windowHeight);}
</script>
</body>
</html>

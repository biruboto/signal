<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>remainder migration — Signal</title>
<style>html,body{margin:0;background:#101317;color:#d8d7cf;font:14px/1.5 ui-monospace,SFMono-Regular,monospace;overflow:hidden}canvas{display:block}.note{position:fixed;left:24px;top:20px;pointer-events:none;text-shadow:0 1px 8px #101317}.note strong{font-weight:400;letter-spacing:.16em;text-transform:uppercase}.note p{color:#92999a;margin:.35em 0}.foot{position:fixed;right:24px;bottom:20px;color:#92999a;text-align:right;pointer-events:none}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script></head>
<body><div class="note"><strong>remainder migration</strong><p id="readout">Every step changes the modulus; the residue must find a new address.</p></div><div class="foot">click to reroute the migration<br>161 / signal</div>
<script>
let routes=[7,11,13], walkers=[], step=0;
function setup(){createCanvas(windowWidth,windowHeight);pixelDensity(1);reset();}
function reset(){walkers=[];step=0;for(let i=0;i<Math.min(540,Math.floor(width/2));i++)walkers.push({seed:i*17+3,trail:[],hue:Math.random()});}
function draw(){background(16,19,23,34);if(frameCount%3===0)advance();noFill();for(const w of walkers){if(w.trail.length<2)continue;stroke(134+70*w.hue,166+34*w.hue,157+40*(1-w.hue),105);strokeWeight(.75);beginShape();for(const p of w.trail)vertex(p.x,p.y);endShape();}fill(16,19,23);noStroke();}
function advance(){step++;const mod=routes[step%routes.length];for(const w of walkers){const residue=(w.seed*step+Math.floor(step/3)**2)%mod;const x=width*(.08+.84*residue/(mod-1));const y=height*(.18+.64*((w.seed%97)/96));w.trail.push({x,y});if(w.trail.length>32)w.trail.shift();}}
function mousePressed(){routes=routes[0]===7?[5,8,13]:routes[0]===5?[9,10,17]:[7,11,13];reset();document.getElementById('readout').textContent=`Route ${routes.join(' → ')}: each new modulus relocates the same integer.`;}
function windowResized(){resizeCanvas(windowWidth,windowHeight);reset();}
</script></body></html>

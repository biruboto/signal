<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime receipt — Signal</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#090b0c;color:#d7d5c9;font:14px/1.5 ui-monospace,SFMono-Regular,monospace;overflow:hidden}canvas{display:block}#label{position:fixed;left:24px;top:22px;pointer-events:none;color:#aaa99e}#label strong{display:block;color:#e3d7b0;font-weight:400;letter-spacing:.12em;text-transform:uppercase}#label span{display:block;margin-top:6px;font-size:11px;color:#737873}#hint{position:fixed;right:24px;bottom:20px;color:#777b76;font-size:11px}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script></head><body><div id="label"><strong>Prime receipt</strong><span id="readout">A number leaves only its failed divisions behind.</span></div><div id="hint">click to issue another receipt</div><script>
let ticket=0, n=137, marks=[];
function issue(){ticket++;n=101+((ticket*71+floor(random(900)))%799);marks=[];for(let d=2;d<=n;d++){if(n%d===0){let prime=true;for(let q=2;q*q<=d;q++)if(d%q===0){prime=false;break}if(prime)marks.push({d,exact:true})}else if(d<Math.sqrt(n)*2)marks.push({d,exact:false})}document.getElementById('readout').textContent=`${n} · ${marks.filter(m=>m.exact).length} exact divisor${marks.filter(m=>m.exact).length===1?'':'s'} · ${marks.length} attempted witnesses`}
function setup(){createCanvas(windowWidth,windowHeight);pixelDensity(1);issue();noLoop()}
function draw(){background(9,11,12);let cx=width*.53,cy=height*.53,R=min(width*.38,height*.37);strokeWeight(1);for(let i=0;i<marks.length;i++){let m=marks[i],a=(i/marks.length)*TWO_PI-HALF_PI;let len=m.exact?18+12*Math.log(m.d):4+(m.d%5);let x1=cx+cos(a)*R,y1=cy+sin(a)*R,x2=cx+cos(a)*(R+len),y2=cy+sin(a)*(R+len);stroke(m.exact?218:72,m.exact?187:91,m.exact?116:83,m.exact?210:105);line(x1,y1,x2,y2);if(m.exact){noStroke();fill(226,190,122);circle(x2,y2,3.5)}}noFill();stroke(52,57,55);circle(cx,cy,R*2);noStroke();fill(190,188,170);textAlign(CENTER,CENTER);textSize(12);text(n,cx,cy);fill(91,98,91);textSize(10);text('divisor ledger / '+ticket,cx,cy+22)}
function mousePressed(){issue();redraw()}function windowResized(){resizeCanvas(windowWidth,windowHeight);redraw()}
</script></body></html>
